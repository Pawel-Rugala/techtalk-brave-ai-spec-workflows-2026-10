<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>AI Factory · dashboard</title>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="logo">🏭</span>
        <div>
          <h1>AI FACTORY <span class="live"><i></i>LIVE</span></h1>
          <div class="sub" id="run-info">no run yet</div>
        </div>
      </div>
      <div class="actions">
        <button id="btn-run" class="btn yellow">▶ Start factory</button>
        <button id="btn-stop" class="btn">■ Stop</button>
        <button id="btn-reset" class="btn ghost">⟲ Reset</button>
        <div class="clock"><b id="clock">--:--:--</b><small id="tz">CET</small></div>
      </div>
    </header>

    <section class="kpis" id="kpis"></section>

    <main>
      <div class="table-wrap card">
        <table>
          <thead>
            <tr>
              <th>#</th><th>Spec / slide</th><th>Status</th><th>Pipeline</th><th>Model</th>
              <th class="num">Tokens in</th><th class="num">out</th><th class="num">cache</th>
              <th class="num">Cost*</th><th class="num">Time</th><th>Start</th><th>Finish</th><th class="num">Attempts</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <p class="foot">* cost at API prices (tokens × model pricing) · times in Europe/Warsaw</p>
      </div>

      <aside class="detail card" id="detail">
        <div class="detail-head">
          <div>
            <span class="label" id="d-id">—</span>
            <h2 id="d-title">Pick a spec from the table</h2>
          </div>
          <a id="d-open" class="btn small" target="_blank" hidden>Open slide ↗</a>
        </div>
        <nav class="tabs" id="tabs">
          <button data-tab="spec" class="on">Spec</button>
          <button data-tab="shot">Screenshot</button>
          <button data-tab="activity">Activity</button>
          <button data-tab="report">Report</button>
        </nav>
        <div class="tab-body" id="tab-body"></div>
      </aside>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
